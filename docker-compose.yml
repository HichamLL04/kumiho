version: "3.8"

services:
  kumiho:
    image: ghcr.io/hichamll04/kumiho:latest
    container_name: kumiho
    ports:
      - "9999:9999"
    volumes:
      - kumiho_config:/app/config
      - kumiho_data:/app/data
      - ./books:/books
    environment:
      - TZ=Asia/Seoul
      - PORT=9999
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-long-random-secret}
      - PLUGIN_SECRET_KEY=${PLUGIN_SECRET_KEY:-1234}
      - PLUGIN_REGISTRY_URL=https://raw.githubusercontent.com/kumiho-plugin/kumiho-plugin-registry/main/index.json
    restart: unless-stopped

volumes:
  kumiho_config:
  kumiho_data:
